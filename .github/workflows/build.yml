name: Build Football Genie APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - improve-fixture-statuses
      - prediction-history
      - prediction-history-details

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Download source code
        uses: actions/checkout@v4

      - name: Check project files
        run: |
          echo "Current directory:"
          pwd
          echo "Files in project root:"
          ls -la
          echo "Checking Gradle files:"
          test -f settings.gradle
          test -f build.gradle
          test -f app/build.gradle
          echo "All required Gradle files were found."

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare permanent signing key
        env:
          SIGNING_KEY_BASE64: ${{ secrets.SIGNING_KEY_BASE64 }}
        run: |
          test -n "$SIGNING_KEY_BASE64"
          echo "$SIGNING_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/football-genie-release.jks"
          echo "SIGNING_KEYSTORE_PATH=$RUNNER_TEMP/football-genie-release.jks" >> "$GITHUB_ENV"

      - name: Build signed Football Genie APK
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: gradle --stacktrace assembleRelease

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: Football-Genie-APK
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
