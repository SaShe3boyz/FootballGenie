name: Build Football Genie APK

on:
workflow_dispatch:
push:
branches:
- main

jobs:
build:
runs-on: ubuntu-latest
steps:
- name: Download source code
uses: actions/checkout@v4

  - name: Check project files
    run: |
      echo "Current directory:"
      pwd
      echo "Files in project root:"
      ls -la
      echo "Checking Gradle files:"
      test -f settings.gradle
      test -f build.gradle
      test -f app/build.gradle
      echo "All required Gradle files were found."

  - name: Set up Java
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '17'

  - name: Set up Android SDK
    uses: android-actions/setup-android@v3

  - name: Set up Gradle
    uses: gradle/actions/setup-gradle@v4

  - name: Build Football Genie
    run: gradle --stacktrace assembleDebug

  - name: Upload APK
    uses: actions/upload-artifact@v4
    with:
      name: Football-Genie-APK
      path: app/build/outputs/apk/debug/*.apk
      if-no-files-found: error
